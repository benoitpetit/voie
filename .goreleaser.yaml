version: 2

project_name: voie

builds:
  - id: voie-amd64
    main: .
    binary: voie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/benoitpetit/voie/internal/brand.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: voie-arm64
    main: .
    binary: voie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/benoitpetit/voie/internal/brand.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: voie
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256
